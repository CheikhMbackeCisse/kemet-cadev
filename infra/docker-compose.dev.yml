# Développement : postgres, valkey et mailpit seulement, ports publiés sur
# l'hôte, pour lancer les applications avec `pnpm dev`.
#
#   docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
#
# `name` et le nom du volume sont explicites : sinon Compose déduit le projet
# du dossier (`infra`) et cette pile prendrait les conteneurs et le volume de
# la pile complète.
#
# Ports sur 127.0.0.1 seulement : Valkey n'a pas de mot de passe et Mailpit
# affiche les liens de vérification d'email.
#
# 5433 et 6380 plutôt que 5432 et 6379 : un PostgreSQL ou un Redis natif
# capterait sinon les connexions sans erreur.
name: kemet-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data_dev:
