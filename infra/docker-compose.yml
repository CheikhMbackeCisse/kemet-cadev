# A lancer depuis la racine du monorepo :
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Voir docs/DEPLOIEMENT.md pour le détail complet, local et production.
#
# Budget mémoire du serveur Datacloud visé : 4 Go au total, 3,2 Go maximum
# pour les sept services ci-dessous, le reste pour le système. Les limites
# posées (voir deploy.resources.limits.memory de chaque service) totalisent
# 2,496 Go : marge volontaire sous le plafond plutôt qu'un remplissage exact.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 64M

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
      UPLOADS_DIR: ${UPLOADS_DIR}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES}
      MAX_USER_STORAGE_BYTES: ${MAX_USER_STORAGE_BYTES}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      WEB_APP_URL: ${WEB_APP_URL}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DATACLOUD_REFERRAL_URL: ${DATACLOUD_REFERRAL_URL}
    volumes:
      - uploads:${UPLOADS_DIR}
    deploy:
      resources:
        limits:
          memory: 448M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: realtime
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      WEB_APP_URL: ${WEB_APP_URL}
    deploy:
      resources:
        limits:
          memory: 320M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: worker
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      NODE_ENV: production
      WORKER_PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
      UPLOADS_DIR: ${UPLOADS_DIR}
    volumes:
      - uploads:${UPLOADS_DIR}
    deploy:
      resources:
        limits:
          memory: 320M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M

  # Capture les emails envoyés en développement local au lieu de les livrer
  # réellement. Démarré uniquement avec --profile dev (jamais en production,
  # où SMTP_HOST pointe vers Brevo ou Resend). Interface web sur
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
    deploy:
      resources:
        limits:
          memory: 64M

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
