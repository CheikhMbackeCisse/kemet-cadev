<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content : à l'ouverture du clavier, Chrome Android réduit la
         page au lieu de la faire glisser sous le clavier ; le composeur du
         salon reste ainsi visible sans saut de défilement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Valeurs de --bg dans src/styles/tokens.css, à garder d'accord. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kemet</title>
    <!-- Fond aux couleurs du thème dès le premier octet, avant le CSS de
         l'application. Valeurs de --bg et --auth-bg-to dans tokens.css. -->
    <style>
      html, body { background-color: #ffffff; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0d1320; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background-color: #0d1320; }
      }
      html[data-arrival], html[data-arrival] body { background-color: #061b47; }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
