<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content : à l'ouverture du clavier, Chrome Android réduit la
         page au lieu de la faire glisser sous le clavier ; le composeur du
         salon reste ainsi visible sans saut de défilement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Valeurs de --bg dans src/styles/tokens.css, à garder d'accord. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kemet</title>
    <!-- Fond aux couleurs du thème dès le premier octet, avant le CSS de
         l'application. Valeurs de --bg, --auth-bg-from et --auth-bg-to dans
         tokens.css. Le dégradé du parcours d'arrivée est celui
         d'ArrivalBackground : il ne change pas quand le décor arrive. -->
    <style>
      html, body { background-color: #ffffff; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0d1320; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background-color: #0d1320; }
      }
      html[data-arrival] { background-color: #061b47; --sw-from: #0b2f78; --sw-to: #061b47; }
      @media (prefers-color-scheme: dark) {
        html[data-arrival]:not([data-theme="light"]) { --sw-from: #0a1f4c; --sw-to: #050e22; }
      }
      html[data-arrival][data-theme="dark"] { --sw-from: #0a1f4c; --sw-to: #050e22; }
      html[data-arrival] {
        background: #061b47 linear-gradient(160deg, var(--sw-from), var(--sw-to)) fixed;
      }
      html[data-arrival] body { background: transparent; }

      /* Accueil statique, peint avant le JavaScript et la feuille de style
         (public/theme-init.js le montre, src/lib/staticWelcome.ts le retire).
         Il reste la carte visible de l'accueil, posée sur celle de React,
         invisible : mêmes mesures que WelcomePage et ArrivalLayout, à garder
         d'accord. */
      @font-face {
        font-family: "Kemet Grotesk Fallback";
        src: local("Arial Bold"), local("Arial-BoldMT"), local("Arial");
        font-weight: 700;
        size-adjust: 100.76%;
        ascent-override: 97.3%;
        descent-override: 28.8%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Kemet Jakarta Fallback";
        src: local("Arial"), local("ArialMT");
        size-adjust: 104.77%;
        ascent-override: 99.3%;
        descent-override: 21%;
        line-gap-override: 0%;
      }
      #static-welcome { display: none; }
      html[data-static-welcome] #static-welcome {
        position: absolute; top: 0; left: 0; z-index: 20;
        width: 100%; min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column;
        pointer-events: none;
        padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        color: #ffffff;
        font-family: "Plus Jakarta Sans", "Kemet Jakarta Fallback", sans-serif;
        font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      #static-welcome * { box-sizing: border-box; }
      .sw-space { flex-shrink: 0; height: 3rem; }
      .sw-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .sw-card, .sw-footer p { pointer-events: auto; }
      .sw-card {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        width: 100%; max-width: 25rem; padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px;
        background-color: rgba(6, 27, 71, 0.5);
        -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px);
        text-align: center;
      }
      .sw-logo { display: block; height: 28px; width: auto; }
      .sw-text { display: flex; flex-direction: column; gap: 6px; }
      .sw-title {
        margin: 0;
        font-family: "Space Grotesk Variable", "Kemet Grotesk Fallback", sans-serif;
        font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .sw-promise { margin: 0; font-size: 13px; line-height: 1.5; color: rgba(255, 255, 255, 0.72); text-wrap: balance; }
      .sw-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
      .sw-start {
        display: inline-flex; align-items: center; justify-content: center;
        width: 100%; height: 44px; padding: 0 24px; border-radius: 8px;
        background-color: #ffffff; color: var(--sw-to);
        font-size: 14px; font-weight: 600; text-decoration: none;
      }
      .sw-start:hover { background-color: #dbe6fb; }
      .sw-explore {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px;
        color: rgba(255, 255, 255, 0.72); font-size: 14px; font-weight: 500;
        text-decoration: none; text-underline-offset: 4px;
      }
      .sw-explore:hover { color: #ffffff; text-decoration: underline; }
      #static-welcome a:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
      .sw-footer {
        flex-shrink: 0; height: 3rem;
        display: flex; align-items: center; justify-content: center; gap: 16px;
        padding: 0 16px env(safe-area-inset-bottom);
      }
      .sw-footer p { margin: 0; display: flex; align-items: baseline; gap: 6px; }
      .sw-powered { font-size: 12px; color: rgba(255, 255, 255, 0.72); }
      .sw-systalink { font-size: 13px; font-weight: 500; }
      .sw-lang-on, .sw-lang {
        min-width: 44px; min-height: 36px; padding: 0 12px; border-radius: 8px;
        display: inline-flex; align-items: center; justify-content: center;
        font: inherit; font-size: 14px; font-weight: 500;
      }
      .sw-lang-on { background-color: #ffffff; color: var(--sw-to); }
      .sw-lang { color: rgba(255, 255, 255, 0.72); text-decoration: none; }
      .sw-lang:hover { color: #ffffff; }
      .sw-lang:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
      @media (min-width: 375px) { .sw-title { font-size: 24px; } }
      @media (min-width: 640px) {
        .sw-main { padding: 32px 16px; }
        .sw-card { padding: 32px; gap: 20px; }
      }
      @media (min-width: 768px) {
        .sw-logo { height: 40px; }
        .sw-promise { font-size: 14px; }
        .sw-start { width: auto; min-width: 12rem; height: 36px; }
        .sw-explore { min-height: 36px; }
      }
    </style>
    <script src="/theme-init.js"></script>
  </head>

      <main class="sw-main">
