<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content : à l'ouverture du clavier, Chrome Android réduit la
         page au lieu de la faire glisser sous le clavier ; le composeur du
         salon reste ainsi visible sans saut de défilement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Valeurs de --bg dans src/styles/tokens.css, à garder d'accord. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>Kemet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
