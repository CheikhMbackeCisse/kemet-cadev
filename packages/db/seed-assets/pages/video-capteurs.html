<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
/* Filmé par render.mjs : la courbe d'humidité se trace en direct et la
   valeur du capteur suit. Pseudo-aléatoire à graine fixe, pour un rendu
   identique à chaque génération. */
body { padding: 0; background: #101624; }
.frame { background: #101624; color: #e6ebf5; padding: 50px 60px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 30px; }
.sub { opacity: .65; font-size: 18px; }
.grid { display: grid; grid-template-columns: 1fr 280px; gap: 24px; flex: 1; }
.chart { background: #1b2438; border-radius: 16px; padding: 18px; }
.side { display: flex; flex-direction: column; gap: 16px; }
.tile { background: #1b2438; border-radius: 16px; padding: 18px; }
.tile small { opacity: .7; font-size: 15px; }
.tile strong { display: block; font-size: 56px; font-weight: 800; color: #5fd38d; }
.tile.alert { background: #3a1f26; }
.tile.alert strong { font-size: 22px; color: #ff8a8a; }
</style>
</head>
<body>
<section class="frame">
  <div><h1>Parcelle de Kaffrine · capteur 12</h1><div class="sub">Relevé toutes les 10 minutes par LoRa</div></div>
  <div class="grid">
    <div class="chart"><svg id="svg" width="100%" height="100%" viewBox="0 0 800 420" preserveAspectRatio="none">
      <g stroke="#2a3550"><line x1="0" y1="105" x2="800" y2="105"/><line x1="0" y1="210" x2="800" y2="210"/><line x1="0" y1="315" x2="800" y2="315"/></g>
      <line x1="0" y1="300" x2="800" y2="300" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8 8"/>
      <polyline id="line" fill="none" stroke="#5fd38d" stroke-width="4"/>
    </svg></div>
    <div class="side">
      <div class="tile"><small>Humidité à 20 cm</small><strong id="value">31 %</strong></div>
      <div class="tile"><small>Pile</small><strong style="color:#6cb2ff">87 %</strong></div>
      <div class="tile alert" id="alert" style="visibility:hidden"><small>Seuil d'irrigation</small><strong>Arroser d'ici 2 jours</strong></div>
    </div>
  </div>
</section>
<script>
let seed = 42;
const random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const points = [];
let humidity = 31;
let x = 0;
const line = document.getElementById("line");
const value = document.getElementById("value");
const alert = document.getElementById("alert");
const timer = setInterval(() => {
  humidity = Math.max(17, humidity - 0.35 + (random() - 0.5) * 0.9);
  const y = 420 - humidity * 10;
  points.push(`${x},${y.toFixed(1)}`);
  line.setAttribute("points", points.join(" "));
  value.textContent = `${Math.round(humidity)} %`;
  if (humidity < 22) alert.style.visibility = "visible";
  x += 8;
  if (x > 800) clearInterval(timer);
}, 60);
</script>
</body>
</html>
