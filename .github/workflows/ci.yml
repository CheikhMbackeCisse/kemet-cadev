name: CI

on:
  push:
    branches: [main]
  # Une pull request en brouillon ne lance rien : on y pousse librement, la
  # CI tourne quand elle passe en prête (ready_for_review), puis à chaque push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Un nouveau push sur une pull request annule le run précédent, devenu
# inutile. Sur main, chaque commit garde son run : Images en dépend.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stack: ${{ steps.changes.outputs.stack }}
    # gitleaks-action liste les commits de la pull request par l'API GitHub :
    # les permissions par défaut du token (lecture seule) renvoient 403 sur
    # cet appel sans ce bloc explicite.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scanne la plage base..head de la pull request : un clone
          # superficiel (le défaut) ne contient pas le commit de base.
          fetch-depth: 0

      # Les jobs qui démarrent la pile ou la base (plusieurs minutes chacun)
      # ne tournent pas pour un commit qui ne touche que la documentation,
      # définie dans code-changes.sh comme pour le workflow Images. Lint,
      # typecheck, tests unitaires, licences et scan des secrets tournent
      # toujours.
      - name: Repérer les chemins modifiés
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE}^{commit}" 2> /dev/null; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(bash .github/scripts/code-changes.sh "$BASE" HEAD)
          if [ -n "$changed" ]; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - name: Tester le choix construire ou réétiqueter du workflow Images
        run: bash .github/scripts/images-plan.test.sh
      - run: pnpm licenses:check
      - name: THIRD_PARTY_LICENSES.md à jour
        run: git diff --exit-code THIRD_PARTY_LICENSES.md

      - name: Scan des secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    if: needs.ci.outputs.stack == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kemet_test
          POSTGRES_PASSWORD: kemet_test
          POSTGRES_DB: kemet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kemet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests d'intégration (packages/db, apps/server)
        env:
          DATABASE_URL_TEST: postgres://kemet_test:kemet_test@localhost:5432/kemet_test
        # --concurrency=1 : les deux paquets partagent la même base de test et
        # la remettent à zéro avant chaque test (resetTestDatabase) ; les
        # lancer en parallèle ferait qu'un paquet efface le schéma en cours
        # d'utilisation par l'autre.
        run: pnpm turbo run test --filter=@kemet/db --filter=@kemet/server --concurrency=1

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    if: needs.ci.outputs.stack == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Générer un fichier d'environnement de CI
        run: |
          set -euo pipefail
          cat > .env <<EOF
          PUBLIC_HOST=:80
          POSTGRES_USER=kemet
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=kemet
          UPLOADS_DIR=/data/uploads
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          BETTER_AUTH_URL=http://localhost
          WEB_APP_URL=http://localhost
          AUTH_RATE_LIMIT_ENABLED=false
          # Tous les parcours passent par la même adresse IP, clé des limites
          # de débit : à 5 messages par minute pour un compte neuf, les
          # parcours du salon se gênent entre eux. La limite elle-même est
          # couverte par les tests d'intégration.
          ANTI_SPAM_NEW_ACCOUNT_FACTOR=1
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          EOF

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Construit les quatre images de la pile avec le cache de couches de
      # GitHub : celui du workflow Images sur main (scope web, api...) et
      # celui de la CI (scope ci-*). docker compose démarre ensuite ces
      # images sans les reconstruire.
      - name: Construire les images de la pile
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: infra/docker-compose.yml
          targets: web,api,realtime,worker
          load: true
          # Le contexte ".." du fichier compose est relatif à infra/ pour
          # docker compose, mais relatif au dossier courant pour bake.
          set: |
            *.context=.
            web.cache-from=type=gha,scope=web
            web.cache-from=type=gha,scope=ci-web
            web.cache-to=type=gha,mode=max,scope=ci-web
            api.cache-from=type=gha,scope=api
            api.cache-from=type=gha,scope=ci-api
            api.cache-to=type=gha,mode=max,scope=ci-api
            realtime.cache-from=type=gha,scope=realtime
            realtime.cache-from=type=gha,scope=ci-realtime
            realtime.cache-to=type=gha,mode=max,scope=ci-realtime
            worker.cache-from=type=gha,scope=worker
            worker.cache-from=type=gha,scope=ci-worker
            worker.cache-to=type=gha,mode=max,scope=ci-worker

      - name: Démarrer la pile (avec Mailpit)
        run: >
          docker compose -f infra/docker-compose.yml --env-file .env
          --profile dev up -d --wait --wait-timeout 180

      - name: Lire la version de Playwright
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Clé sur la version de Playwright, pas sur tout le lockfile : le
      # navigateur ne change qu'avec elle.
      - name: Garder les navigateurs Playwright en cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Sans --with-deps : l'image ubuntu-latest embarque déjà Google Chrome
      # et ses bibliothèques. Les paquets système de Playwright (polices
      # surtout) passaient par les miroirs apt d'Azure, jusqu'à 15 minutes
      # par run pour 2 minutes de tests.
      - name: Installer les navigateurs Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kemet/web exec playwright install chromium

      - name: Lancer les parcours Playwright (bureau et mobile)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost
          MAILPIT_URL: http://localhost:8025
        run: pnpm --filter @kemet/web test:e2e

      - name: Déposer le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          # Les artefacts comptent dans le stockage limité d'un dépôt privé.
          retention-days: 7

      - name: Enregistrer les journaux des services en cas d'échec
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --timestamps > docker-compose.log

      - name: Déposer les journaux des services en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log

      - name: Arrêter et nettoyer la pile
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env --profile dev down -v

  infra-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    if: needs.ci.outputs.stack == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer un fichier d'environnement de CI
        run: |
          set -euo pipefail
          cat > .env <<EOF
          PUBLIC_HOST=:80
          POSTGRES_USER=kemet
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=kemet
          UPLOADS_DIR=/data/uploads
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          BETTER_AUTH_URL=http://localhost
          WEB_APP_URL=http://localhost
          EOF

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Construit les quatre images de la pile avec le cache de couches de
      # GitHub : celui du workflow Images sur main (scope web, api...) et
      # celui de la CI (scope ci-*). docker compose démarre ensuite ces
      # images sans les reconstruire.
      - name: Construire les images de la pile
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: infra/docker-compose.yml
          targets: web,api,realtime,worker
          load: true
          # Le contexte ".." du fichier compose est relatif à infra/ pour
          # docker compose, mais relatif au dossier courant pour bake.
          set: |
            *.context=.
            web.cache-from=type=gha,scope=web
            web.cache-from=type=gha,scope=ci-web
            api.cache-from=type=gha,scope=api
            api.cache-from=type=gha,scope=ci-api
            realtime.cache-from=type=gha,scope=realtime
            realtime.cache-from=type=gha,scope=ci-realtime
            worker.cache-from=type=gha,scope=worker
            worker.cache-from=type=gha,scope=ci-worker

      - name: Démarrer la pile
        run: >
          docker compose -f infra/docker-compose.yml --env-file .env
          up -d --wait --wait-timeout 180

      - name: Vérifier la page d'accueil à travers Caddy
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error http://localhost/)
          echo "$body" | grep -qi "<title>Kemet</title>"

      - name: Vérifier /api/health à travers Caddy
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error http://localhost/api/health)
          echo "$body" | grep -q '"status":"ok"'

      - name: Vérifier la poignée de main Socket.IO à travers Caddy
        run: |
          set -euo pipefail
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://localhost/socket.io/?EIO=4&transport=polling")
          test "$status" = "200"

      - name: Vérifier /realtime/health à travers Caddy
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error http://localhost/realtime/health)
          echo "$body" | grep -q '"service":"realtime"'

      - name: Consigner l'état et la mémoire des services dans le résumé
        if: always()
        run: |
          {
            echo "## infra-smoke"
            echo
            echo "### docker compose ps"
            echo '```'
            docker compose -f infra/docker-compose.yml --env-file .env ps
            echo '```'
            echo
            echo "### docker stats --no-stream"
            echo '```'
            docker stats --no-stream
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier la santé des services et le plafond mémoire (3,2 Go)
        run: node .github/scripts/check-infra-smoke.mjs

      - name: Afficher les journaux des services en cas d'échec
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs

      - name: Arrêter et nettoyer la pile
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v

  # Restauration testée pour de vrai : sauvegarde de la pile complète par
  # infra/server/backup.sh, modification des données, puis
  # infra/server/restore.sh, qui doit ramener exactement l'état sauvegardé.
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    if: needs.ci.outputs.stack == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Installer age
        run: sudo apt-get update -q && sudo apt-get install -y -q age

      - name: Générer une clé age et un fichier d'environnement de CI
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/backup-key.txt" 2> /dev/null
          recipient=$(age-keygen -y "$RUNNER_TEMP/backup-key.txt")
          cat > .env <<ENV
          PUBLIC_HOST=:80
          POSTGRES_USER=kemet
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=kemet
          UPLOADS_DIR=/data/uploads
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          BETTER_AUTH_URL=http://localhost
          WEB_APP_URL=http://localhost
          EMAIL_FROM=Kemet <kemet@example.com>
          BACKUP_AGE_RECIPIENT=$recipient
          ENV

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Construit les quatre images de la pile avec le cache de couches de
      # GitHub : celui du workflow Images sur main (scope web, api...) et
      # celui de la CI (scope ci-*). docker compose démarre ensuite ces
      # images sans les reconstruire.
      - name: Construire les images de la pile
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: infra/docker-compose.yml
          targets: web,api,realtime,worker
          load: true
          # Le contexte ".." du fichier compose est relatif à infra/ pour
          # docker compose, mais relatif au dossier courant pour bake.
          set: |
            *.context=.
            web.cache-from=type=gha,scope=web
            web.cache-from=type=gha,scope=ci-web
            api.cache-from=type=gha,scope=api
            api.cache-from=type=gha,scope=ci-api
            realtime.cache-from=type=gha,scope=realtime
            realtime.cache-from=type=gha,scope=ci-realtime
            worker.cache-from=type=gha,scope=worker
            worker.cache-from=type=gha,scope=ci-worker

      - name: Démarrer la pile
        run: >
          docker compose -f infra/docker-compose.yml --env-file .env
          up -d --wait --wait-timeout 180

      - name: Poser des données témoins
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml --env-file .env exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE backup_probe (value text); INSERT INTO backup_probe VALUES ('"'"'before'"'"');"'
          docker compose -f infra/docker-compose.yml --env-file .env exec -T api \
            sh -c 'echo before > "$UPLOADS_DIR/probe.txt"'

      - name: Sauvegarder
        run: |
          set -euo pipefail
          BACKUP_DIR=$RUNNER_TEMP/backups infra/server/backup.sh | tee "$RUNNER_TEMP/backup-files"
          test "$(wc -l < "$RUNNER_TEMP/backup-files")" = 2
          # L'archive des fichiers envoyés contiendrait "before" en clair si
          # age n'avait pas chiffré. Pas de "! grep" : set -e l'ignore.
          if grep -q before $(cat "$RUNNER_TEMP/backup-files"); then exit 1; fi

      - name: Modifier les données après la sauvegarde
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml --env-file .env exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "UPDATE backup_probe SET value = '"'"'after'"'"';"'
          docker compose -f infra/docker-compose.yml --env-file .env exec -T api \
            sh -c 'rm "$UPLOADS_DIR/probe.txt" && echo stray > "$UPLOADS_DIR/stray.txt"'

      - name: Restaurer et vérifier
        run: |
          set -euo pipefail
          dump=$(grep '\.dump\.age$' "$RUNNER_TEMP/backup-files")
          uploads=$(grep '\.uploads\.tar\.age$' "$RUNNER_TEMP/backup-files")
          age -d -i "$RUNNER_TEMP/backup-key.txt" "$dump" | infra/server/restore.sh --confirm database
          age -d -i "$RUNNER_TEMP/backup-key.txt" "$uploads" | infra/server/restore.sh --confirm uploads
          value=$(docker compose -f infra/docker-compose.yml --env-file .env exec -T postgres \
            sh -c 'psql -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT value FROM backup_probe;"')
          test "$value" = before
          docker compose -f infra/docker-compose.yml --env-file .env exec -T api \
            sh -c 'test "$(cat "$UPLOADS_DIR/probe.txt")" = before && test ! -e "$UPLOADS_DIR/stray.txt"'
          curl --fail --silent --show-error http://localhost/api/health

      - name: Afficher les journaux des services en cas d'échec
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs

      - name: Arrêter et nettoyer la pile
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v
